# This template is for importing into Better Notes:
# copy this whole file content, then in Zotero use Tools -> New Template from Clipboard.
# Do not paste only the `content` block into the Better Notes template editor.
name: "[item]Codex 中英文献精读卡"
content: |-
  // @use-markdown
  ${{
    if (!sharedObj.codexReadingCard) {
      const field = (item, key) => {
        try {
          return item?.getField?.(key) || "";
        } catch (_e) {
          return "";
        }
      };

      const text = (value) => String(value || "").replace(/\s+/g, " ").trim();
      const tableText = (value) => text(value).replace(/\|/g, "\\|");
      const datePart = (value) => text(value).split("T")[0];

      const creators = (item) => {
        try {
          const all = item?.getCreators?.() || [];
          const names = all
            .slice(0, 12)
            .map((creator) => text([creator.firstName, creator.lastName].filter(Boolean).join(" ")) || text(creator.name))
            .filter(Boolean);
          return names.join("; ") + (all.length > 12 ? "; et al." : "");
        } catch (_e) {
          return "";
        }
      };

      const tags = (item) => {
        try {
          return (item?.getTags?.() || []).map((tag) => tag.tag).filter(Boolean).join(", ");
        } catch (_e) {
          return "";
        }
      };

      const extraCitationKey = (item) => {
        const match = field(item, "extra").match(/Citation Key:\s*(.+?)(\n|$)/i);
        return match ? text(match[1]) : "";
      };

      const citekey = (item) => text(item?.citationKey || field(item, "citationKey") || extraCitationKey(item));

      const librarySegment = (item) => {
        try {
          const library = Zotero.Libraries.get(item.libraryID);
          if (library?.libraryType === "user") return "library";
          const groupID = library?.groupID || library?.id;
          return groupID ? `groups/${groupID}` : "library";
        } catch (_e) {
          return "library";
        }
      };

      const zoteroSelectLink = (item) => {
        if (!item?.key) return "";
        return `zotero://select/${librarySegment(item)}/items/${item.key}`;
      };

      const bestPdfAttachment = async (item) => {
        try {
          if (typeof item?.getBestAttachment === "function") {
            const attachment = await item.getBestAttachment();
            if (attachment?.isPDFAttachment?.() || attachment?.attachmentContentType === "application/pdf") return attachment;
          }
        } catch (_e) {}

        try {
          if (typeof item?.getBestAttachments === "function") {
            const attachments = await item.getBestAttachments();
            const pdf = (attachments || []).find((att) => att?.isPDFAttachment?.() || att?.attachmentContentType === "application/pdf");
            if (pdf) return pdf;
          }
        } catch (_e) {}

        try {
          const attachments = Zotero.Items.get(item?.getAttachments?.() || []);
          return (attachments || []).find((att) => att?.isPDFAttachment?.() || att?.attachmentContentType === "application/pdf") || null;
        } catch (_e) {
          return null;
        }
      };

      const pdfLink = async (item) => {
        const pdf = await bestPdfAttachment(item);
        if (!pdf?.key) return "";
        return `zotero://open-pdf/${librarySegment(pdf)}/items/${pdf.key}`;
      };

      const mdLink = (label, href) => {
        const safeLabel = text(label);
        const safeHref = text(href);
        return safeHref ? `[${safeLabel || safeHref}](${safeHref})` : "";
      };

      sharedObj.codexReadingCard = {
        field,
        text,
        tableText,
        datePart,
        creators,
        tags,
        citekey,
        zoteroSelectLink,
        pdfLink,
        mdLink,
      };
    }
    return "";
  }}$

  # ${sharedObj.codexReadingCard.text(sharedObj.codexReadingCard.field(topItem, "title")) || "Untitled Zotero Item"}

  > [!info] 文献信息
  > - **原题名**：${sharedObj.codexReadingCard.text(sharedObj.codexReadingCard.field(topItem, "title"))}
  > - **中文题名 / 译名**：${sharedObj.codexReadingCard.text(sharedObj.codexReadingCard.field(topItem, "titleTranslation"))}
  > - **作者**：${sharedObj.codexReadingCard.creators(topItem)}
  > - **年份**：${sharedObj.codexReadingCard.datePart(sharedObj.codexReadingCard.field(topItem, "date"))}
  > - **期刊 / 来源**：${sharedObj.codexReadingCard.text(sharedObj.codexReadingCard.field(topItem, "publicationTitle") || sharedObj.codexReadingCard.field(topItem, "proceedingsTitle") || sharedObj.codexReadingCard.field(topItem, "bookTitle"))}
  > - **DOI**：${sharedObj.codexReadingCard.mdLink(sharedObj.codexReadingCard.field(topItem, "DOI"), sharedObj.codexReadingCard.field(topItem, "DOI") ? "https://doi.org/" + sharedObj.codexReadingCard.field(topItem, "DOI") : "")}
  > - **URL**：${sharedObj.codexReadingCard.mdLink(sharedObj.codexReadingCard.field(topItem, "url"), sharedObj.codexReadingCard.field(topItem, "url"))}
  > - **Zotero 条目**：${sharedObj.codexReadingCard.mdLink(topItem.key, sharedObj.codexReadingCard.zoteroSelectLink(topItem))}
  > - **PDF**：${sharedObj.codexReadingCard.mdLink("打开 PDF", await sharedObj.codexReadingCard.pdfLink(topItem))}
  > - **Citekey**：${sharedObj.codexReadingCard.citekey(topItem)}
  > - **Zotero 标签**：${sharedObj.codexReadingCard.tags(topItem)}
  > - **建卡日期**：${new Date().toLocaleDateString()}

